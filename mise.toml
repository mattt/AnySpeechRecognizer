# Swift comes from Xcode, not from mise. No task downloads models unless its name says so.

[tasks.setup]
description = "Resolve Swift package dependencies without downloading models"
run = "xcrun swift package resolve"

[tasks.build]
description = "Build the library and the hear CLI"
run = "xcrun swift build"

[tasks."build:ios"]
description = "Compile the library for iOS without code signing"
run = "xcodebuild -scheme AnySpeechRecognizer -destination 'generic/platform=iOS' -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build -quiet"

[tasks.test]
description = "Run the tests without model downloads"
run = "xcrun swift test"

[tasks."test:compatibility"]
description = "Build the compatibility fixtures against Speech and AnySpeechRecognizer"
run = "bash Tools/check-compatibility.sh"

[tasks."test:integration"]
description = "Run opt-in recognition tests with local audio and installed assets"
run = '''
#!/usr/bin/env bash
# Apple:    ANYSPEECH_INTEGRATION_AUDIO=<speech file>
# Parakeet: ANYSPEECH_PARAKEET_MODELS=<staged model directory>
#           ANYSPEECH_PARAKEET_LONG_AUDIO=<speech longer than 15 s>
#           ANYSPEECH_PARAKEET_SHORT_AUDIO=<speech shorter than 15 s> (optional)
# Nemotron: ANYSPEECH_NEMOTRON_MODELS=<directory from Tools/NemotronConversion>
#           ANYSPEECH_NEMOTRON_AUDIO=<speech> (optional)
set -euo pipefail
filters=()
if [ -n "${ANYSPEECH_INTEGRATION_AUDIO:-}" ]; then
    filters+=(--filter AppleIntegration)
fi
if [ -n "${ANYSPEECH_PARAKEET_MODELS:-}" ]; then
    filters+=(--filter ParakeetAnalyzer --filter ParakeetModelTests)
fi
if [ -n "${ANYSPEECH_NEMOTRON_MODELS:-}" ]; then
    filters+=(--filter NemotronCoreMLTests)
fi
if [ "${#filters[@]}" -eq 0 ]; then
    echo "error: Set ANYSPEECH_INTEGRATION_AUDIO, ANYSPEECH_PARAKEET_MODELS, or ANYSPEECH_NEMOTRON_MODELS." >&2
    exit 1
fi
exec xcrun swift test --no-parallel "${filters[@]}"
'''

[tasks.evaluate]
description = "Evaluate a local recording with an explicit backend and installed assets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec xcrun swift run hear evaluate "$@"
'''

[tasks."prepare:apple"]
description = "Download and prepare Apple Speech assets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec xcrun swift run hear prepare --backend apple "$@"
'''

[tasks."prepare:parakeet"]
description = "Download, verify, and prepare the pinned Parakeet assets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec xcrun swift run hear prepare --backend parakeet "$@"
'''

[tasks."prepare:nemotron"]
description = "Download, verify, and prepare the pinned Nemotron assets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec xcrun swift run hear prepare --backend nemotron "$@"
'''
