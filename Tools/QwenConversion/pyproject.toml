[project]
name = "qwen-conversion"
version = "0.1.0"
description = "Convert Qwen3-ASR checkpoints to Core ML for AnySpeechRecognizer"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "coremltools==9.0",
    "huggingface-hub",
    "jiwer",
    # coremltools 9.0 converts one-element arrays with int(), which NumPy 2.4 rejects.
    "numpy==2.3.5",
    "safetensors",
    "soundfile",
    # transformers 5.20 imports torch.distributed.checkpoint.hf_storage, which PyTorch 2.7 lacks.
    # coremltools 9.0 is tested with PyTorch 2.7 and warns about 2.8.
    "torch==2.8.0",
    # Qwen3ASRForConditionalGeneration first shipped in transformers 5.13.0.
    "transformers==5.20.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
