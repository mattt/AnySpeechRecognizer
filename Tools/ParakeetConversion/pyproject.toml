[project]
name = "parakeet-conversion"
version = "0.1.0"
description = "Convert NVIDIA Parakeet TDT checkpoints to Core ML for AnySpeechRecognizer"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "coremltools==9.0",
    "huggingface-hub",
    "jiwer",
    "nemo-toolkit[asr]==3.0.0",
    # coremltools 9.0 converts one-element arrays with int(), which NumPy 2.4 rejects.
    "numpy==2.3.5",
    "safetensors",
    "soundfile",
    "torch==2.7.0",
    "torchaudio==2.7.0",
]

[tool.uv]
package = false
override-dependencies = [
    # NeMo caps hydra-core at 1.3.2 and lightning at 2.4.0, which caps fsspec below 2026;
    # the capped versions are affected by security advisories.
    "fsspec[http]>=2026.6.0",
    "hydra-core>=1.3.6",
]

[tool.ruff]
line-length = 120
